<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рахмат!</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('./bg.jpg') no-repeat center center/cover;
            height: 100vh; display: flex; justify-content: center; align-items: center; color: white;
        }
        .message-box {
            background: rgba(255, 255, 255, 0.95); color: #333; padding: 40px; border-radius: 20px;
            max-width: 400px; margin: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { font-family: 'Caveat', cursive; font-size: 3.5rem; color: #B5835A; margin: 0 0 10px 0; }
        p { font-size: 1.1rem; line-height: 1.6; color: #555; }
        .back-btn {
            display: inline-block; margin-top: 20px; background-color: #B5835A; color: white;
            text-decoration: none; padding: 12px 25px; font-weight: 600; border-radius: 8px; transition: 0.3s;
        }
        .back-btn:hover { background-color: #966943; }
    </style>
</head>
<body>
    <div class="message-box">
        <h1>Рахмат!</h1>
        <p>Жообуңуз ийгиликтүү кабыл алынды.</p>
        <a href="/" class="back-btn">Артка кайтуу</a>
    </div>
</body>
</html>
